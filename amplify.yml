version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Don't use $VERSION_NODE_22 — it is undefined in this build image, so
        # `nvm use` gets an empty argument, hunts for a .nvmrc, and exits 127.
        - nvm use 22 || nvm install 22
        # `npm install`, not `npm ci`. The lockfile is generated on Windows,
        # where npm cannot resolve the transitive dependencies of Linux-only
        # optional packages — next/image pulls in sharp, whose wasm variant
        # needs @emnapi/*, and those entries simply never get written. `npm ci`
        # demands an exact match and fails EUSAGE here; `npm install` resolves
        # the missing platform deps at install time. Versions stay pinned by
        # the lockfile either way.
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
