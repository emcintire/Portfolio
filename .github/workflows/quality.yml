name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      # `npm install`, not `npm ci` — the lockfile is generated on Windows and
      # omits Linux-only optional deps of sharp. See amplify.yml.
      - run: npm install
      # Next's build cache; without it every run recompiles from scratch.
      - uses: actions/cache@v4
        with:
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          path: .next/cache
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run check

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      # `npm install`, not `npm ci` — the lockfile is generated on Windows and
      # omits Linux-only optional deps of sharp. See amplify.yml.
      - run: npm install
      - uses: actions/cache@v4
        with:
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          path: .next/cache
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # Build here rather than inside Playwright's webServer timeout. The suite
      # tests prerendered HTML and real status codes, so it needs the production
      # build, and a cold `next build` can outlast the webServer budget.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=mobile-chromium
